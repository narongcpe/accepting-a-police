<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>ระบบรับแจ้งเหตุล่วงหน้า</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app bar with mode switch; citizen side = single mobile-first column; officer side = nav rail + work area */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#e6ebf2; --ink:#142032; --muted:#5a6779; --line:#d3dae4;
  --accent:#1c4d8f; --accent-ink:#ffffff; --accent-soft:#dde7f5;
  --hi:#b8322a; --hi-soft:#f8e1de; --med:#9a6512; --med-soft:#f6ead2; --low:#27704f; --low-soft:#dcefe5;
  --emer:#b8322a;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141d; --surface:#161f2c; --surface-2:#1d2838; --ink:#e5ebf3; --muted:#9aa6b7; --line:#2a3647;
  --accent:#86aee8; --accent-ink:#0e141d; --accent-soft:#1d3150;
  --hi:#f0857a; --hi-soft:#3b201e; --med:#e2b264; --med-soft:#3a2e18; --low:#6fc79f; --low-soft:#16322a; --emer:#e0574b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141d; --surface:#161f2c; --surface-2:#1d2838; --ink:#e5ebf3; --muted:#9aa6b7; --line:#2a3647;
  --accent:#86aee8; --accent-ink:#0e141d; --accent-soft:#1d3150;
  --hi:#f0857a; --hi-soft:#3b201e; --med:#e2b264; --med-soft:#3a2e18; --low:#6fc79f; --low-soft:#16322a; --emer:#e0574b;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
h1,h2,h3{font-family:var(--f-display);line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* app bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.seal{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none}
.brand b{font-family:var(--f-display);font-size:1.05rem;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:.78rem}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--hi);border-color:var(--hi)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:14px;align-content:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.field{display:grid;gap:5px}
.field label,.lbl{font-size:.82rem;color:var(--muted);font-weight:500}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=datetime-local],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
textarea{min-height:110px;resize:vertical}
input[readonly]{background:var(--surface-2);color:var(--muted)}
.check{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.check input{margin-top:5px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:6px 16px}
.kv dt{color:var(--muted);font-size:.85rem}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.9rem}
.hr{height:1px;background:var(--line);border:0;margin:4px 0}

/* chips */
.lv{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.lv::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.lv-high{background:var(--hi-soft);color:var(--hi)} .lv-med{background:var(--med-soft);color:var(--med)} .lv-low{background:var(--low-soft);color:var(--low)}
.st{display:inline-block;padding:2px 10px;border-radius:6px;font-size:.8rem;background:var(--surface-2);white-space:nowrap}
.st-new{background:var(--accent-soft);color:var(--accent)} .st-closed{background:var(--low-soft);color:var(--low)}
.st-cancelled,.st-referred{color:var(--muted)}
.sla{font-size:.78rem;white-space:nowrap} .sla.over{color:var(--hi);font-weight:600}
.sample{font-size:.72rem;letter-spacing:.04em;padding:1px 7px;border-radius:4px;border:1px dashed var(--line);color:var(--muted)}

/* citizen */
.cit{max-width:760px;margin:0 auto;padding-block:22px 60px}
.stepper{display:flex;gap:4px;margin-bottom:6px}
.stepper span{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}
.stepper span.on{background:var(--accent)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cat{text-align:left;border:1px solid var(--line);background:var(--surface);padding:12px 14px;border-radius:var(--r);cursor:pointer;display:grid;gap:2px}
.cat:hover,.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cat b{font-weight:600}
.cat span{font-size:.82rem;color:var(--muted)}
.emer{border:2px solid var(--emer);border-radius:var(--r);padding:18px;display:grid;gap:10px}
.emer .num{font-family:var(--f-display);font-size:2.4rem;color:var(--emer);line-height:1}
.thaid{display:grid;gap:10px}
.person{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);cursor:pointer;width:100%}
.person:hover{border-color:var(--accent)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;flex:none}
.tracknum{font-family:var(--f-mono);font-size:1.35rem;letter-spacing:.04em}
.ticket{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;border:1px dashed var(--accent);border-radius:var(--r);padding:16px;background:var(--accent-soft)}
.qr{background:#fff;padding:6px;border-radius:6px;line-height:0}
.qr img,.qr canvas{width:112px;height:112px}
.caselist{display:grid;gap:8px}
.caseitem{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer;width:100%}
.caseitem:hover{border-color:var(--accent)}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0}
.timeline li{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:12px;position:relative}
.timeline li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:7px}
.timeline li::after{content:"";position:absolute;left:4px;top:20px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline li>span:empty{display:none}
.timeline .int::before{background:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip[disabled]{opacity:.4;cursor:not-allowed;text-decoration:line-through}

/* map */
.mapbox{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
@media (max-width:720px){.mapbox{grid-template-columns:1fr}}
svg.map{width:100%;height:auto;display:block;border-radius:var(--r);background:var(--surface-2);cursor:crosshair;border:1px solid var(--line)}
.map .grid{stroke:var(--line);stroke-width:1}
.map .river{fill:none;stroke:var(--accent-soft);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.map .rlabel{fill:var(--muted);font-size:13px}
.map .stn{cursor:pointer}
.map .stn circle{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.map .stn.sel circle{fill:var(--accent)}
.map .stn text{fill:var(--ink);font-size:13px;font-weight:600;paint-order:stroke;stroke:var(--surface-2);stroke-width:4px}
.map .me{fill:var(--hi);stroke:var(--surface);stroke-width:3}
.map .line{stroke:var(--hi);stroke-width:2;stroke-dasharray:5 5}
.stnlist{display:grid;gap:8px;align-content:start}
.stnrow{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:4px;background:var(--surface)}
.stnrow.sel{border-color:var(--accent);background:var(--accent-soft)}

/* officer */
.off{display:grid;grid-template-columns:210px minmax(0,1fr);max-width:1240px;margin:0 auto;gap:22px;padding-block:20px 60px}
@media (max-width:860px){.off{grid-template-columns:1fr}}
.rail{display:grid;gap:4px;align-content:start}
@media (max-width:860px){.rail{display:flex;flex-wrap:wrap}}
.rail button{text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:8px}
.rail button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.rail .who{padding:10px 12px;font-size:.85rem;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:6px}
@media (max-width:860px){.rail .who{width:100%}}
.badge{background:var(--hi);color:var(--surface);border-radius:999px;font-size:.72rem;padding:0 7px;line-height:1.5rem}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left}
.sum b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1.2;font-variant-numeric:tabular-nums}
.sum span{font-size:.82rem;color:var(--muted)}
.sum.alert b{color:var(--hi)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.03em;background:var(--surface-2);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.stripe{padding:0;width:5px}
td.stripe i{display:block;width:5px;min-height:44px;height:100%}
.s-high{background:var(--hi)} .s-med{background:var(--med)} .s-low{background:var(--low)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.casegrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.casegrid{grid-template-columns:1fr}}
.actions{display:grid;gap:14px}
.actions .grp{display:grid;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.actions .grp:last-child{border-bottom:0;padding-bottom:0}
.why{margin:0;padding-left:18px;font-size:.88rem}
.evid{display:flex;gap:8px;flex-wrap:wrap}
.evid span{background:var(--surface-2);border-radius:6px;padding:4px 10px;font-size:.84rem}

/* reports */
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(110px,170px) 1fr 44px;gap:10px;align-items:center;font-size:.88rem}
.bar .track{display:block;height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar .num{font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:16px;border-bottom:1px solid var(--line)}
.cols div{flex:1;min-width:0;background:var(--accent);border-radius:3px 3px 0 0;position:relative;opacity:.85}
.cols div:hover{opacity:1}
.cols div[data-v]:hover::after{content:attr(data-v);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:.75rem;background:var(--ink);color:var(--surface);padding:1px 6px;border-radius:4px;white-space:nowrap}
.colx{display:flex;gap:3px;font-size:.7rem;color:var(--muted)}
.colx span{flex:1;min-width:0;text-align:center;overflow:hidden}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi span{font-size:.8rem;color:var(--muted)}
.home{max-width:900px;margin:0 auto;padding-block:30px 60px;display:grid;gap:22px}
.eyebrow{font-size:.78rem;letter-spacing:.08em;color:var(--accent);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{display:grid;gap:10px;justify-items:start;align-content:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;cursor:pointer}
.tile:hover{border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.tile{transition:transform .15s,border-color .15s}.tile:hover{transform:translateY(-2px)}}
.tile .ic{width:68px;height:68px;border-radius:18px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile.officer .ic{background:var(--ink);color:var(--surface)}
.tile.nearby .ic{background:var(--hi-soft);color:var(--hi)}
.tile .ic svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-family:var(--f-display);font-size:1.25rem;line-height:1.3}
.tile .d{font-size:.88rem;color:var(--muted)}
@media (max-width:640px){.tiles{grid-template-columns:1fr}.tile{grid-template-columns:auto 1fr;column-gap:16px;align-items:center;padding:16px}.tile .ic{grid-row:span 2;width:60px;height:60px}}
.tracklink{justify-self:start;border:0;background:transparent;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0}
.nearest{display:grid;gap:10px;border:2px solid var(--accent);border-radius:16px;padding:18px;background:var(--surface)}
.nearest .big{font-family:var(--f-display);font-size:1.6rem;line-height:1.2}
.map .acc{fill:var(--hi);opacity:.15}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:8px;z-index:20;font-size:.9rem;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>

<header class="appbar">
  <div class="appbar-in wrap">
    <div class="brand" data-act="mode" data-v="home" style="cursor:pointer">
      <div class="seal" aria-hidden="true">รจ</div>
      <div><b>ระบบรับแจ้งเหตุล่วงหน้า</b><small>ต้นแบบเฟส 1 · ตัวอย่างจังหวัดเชียงใหม่ · ThaID จำลอง · ข้อมูลตัวอย่าง</small></div>
    </div>
    <button id="m-home" class="btn" data-act="mode" data-v="home" hidden><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="currentColor"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg>เมนูหลัก</button>
  </div>
</header>
<main id="app" class="wrap"></main>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_D=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const fd=d=>{d=new Date(d);return `${d.getDate()} ${TH_M[d.getMonth()]} ${d.getFullYear()+543}`};
const ft=d=>{d=new Date(d);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fdt=d=>`${fd(d)} ${ft(d)} น.`;
const dkey=d=>{d=new Date(d);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const fpid=p=>`${p[0]}-${p.slice(1,5)}-${p.slice(5,10)}-${p.slice(10,12)}-${p[12]}`;
const mpid=p=>`${p[0]}-xxxx-xxxxx-${p.slice(10,12)}-${p[12]}`;
const money=n=>Number(n||0).toLocaleString('th-TH');
const H=3600e3, D=24*H;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}

/* ============ reference data ============ */
const CATS={
  assault:{name:'ทำร้ายร่างกาย',hint:'ถูกทำร้าย ชกต่อย หรือใช้อาวุธ',base:'high'},

/* ============ triage ============ */
function triage(c){
  const cat=CATS[c.category]; let lv=cat.base;
  const why=[`ประเภท "${cat.name}" มีระดับตั้งต้น${LV[lv].name}`];
  if(c.injured&&lv!=='high'){lv='high';why.push('มีผู้บาดเจ็บ จึงปรับเป็นระดับสูง')}
  else if(c.injured) why.push('มีผู้บาดเจ็บ');
  if(c.weapon&&lv!=='high'){lv='high';why.push('มีการใช้หรือขู่ด้วยอาวุธ จึงปรับเป็นระดับสูง')}
  else if(c.weapon) why.push('มีการใช้หรือขู่ด้วยอาวุธ');
  if(Number(c.damage)>=100000&&lv!=='high'){lv=lv==='low'?'med':'high';why.push('ความเสียหายตั้งแต่ 100,000 บาท จึงปรับขึ้น 1 ระดับ')}
  return {level:lv,why};
}

function mapSvg(me,selId){
  let g='';for(let i=1;i<7;i++){g+=`<line class="grid" x1="${i*100}" y1="0" x2="${i*100}" y2="${B.h}"/><line class="grid" x1="0" y1="${i*100}" x2="${B.w}" y2="${i*100}"/>`}
  const river=RIVER.map(([lng,lat])=>px({lat,lng}).map(v=>v.toFixed(1)).join(',')).join(' ');
  const [mx,my]=px(me);
  const inB=me.lat>B.lat0&&me.lat<B.lat1&&me.lng>B.lng0&&me.lng<B.lng1;
  const accPx=me.acc?Math.min(90,Math.max(10,me.acc/1000/((B.lat1-B.lat0)*111)*B.h)):0;
  const sorted=STATIONS.map(s=>({s,d:km(me,s)})).sort((a,b)=>a.d-b.d);
  const near=sorted[0].s; const target=selId?stn(selId):near; const [tx,ty]=px(target);
  const st=STATIONS.map(s=>{const[x,y]=px(s);const L=x>480||s.lab==='l';const anchor=L?'end':'start';const dx=L?-12:12;return `<g class="stn${s.id===selId?' sel':''}" data-act="pickstn" data-id="${s.id}" role="button" aria-label="${esc(s.name)}"><circle cx="${x}" cy="${y}" r="9"/><text x="${x+dx}" y="${y+5}" text-anchor="${anchor}">${esc(s.name)}</text></g>`}).join('');
  return `<svg class="map" viewBox="0 0 ${B.w} ${B.h}" role="img" aria-label="แผนผังโรงพัก คลิกเพื่อกำหนดตำแหน่งของคุณ">
    ${g}<polyline class="river" points="${river}"/><text class="rlabel" x="${px({lat:18.735,lng:99.012}).join('" y="')}" dx="12">แม่น้ำปิง</text>
    ${(()=>{const[a,b]=px({lat:18.795,lng:98.982}),[c,d]=px({lat:18.782,lng:98.995});return `<rect x="${a}" y="${b}" width="${c-a}" height="${d-b}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="3 3"/><text class="rlabel" x="${a}" y="${d+16}">คูเมือง</text>`})()}
    <text class="rlabel" x="${px({lat:18.815,lng:98.893}).join('" y="')}">← ดอยสุเทพ</text>
    ${inB?`<line class="line" x1="${mx}" y1="${my}" x2="${tx}" y2="${ty}"/>`:''}
    ${st}${inB?`${accPx?`<circle class="acc" cx="${mx}" cy="${my}" r="${accPx}"/>`:''}<circle class="me" cx="${mx}" cy="${my}" r="8"/>`:''}
  </svg>`;
}
function stationPicker(selId,forWizard){
  const me=S.c.me;
  const outside=!(me.lat>B.lat0&&me.lat<B.lat1&&me.lng>B.lng0&&me.lng<B.lng1);
  const sorted=STATIONS.map(s=>({s,d:km(me,s)})).sort((a,b)=>a.d-b.d);
  return `<div class="stack">
    <div class="row"><button class="btn primary" data-act="gps" ${GPS.busy?'disabled':''}>${GPS.busy?'กำลังหาตำแหน่ง…':'ใช้ตำแหน่งจากมือถือ (GPS)'}</button><span class="small"><span class="muted">ตำแหน่งที่ใช้:</span> <b>${esc(me.label)}</b></span></div>

    <div class="row small"><span class="muted">หรือแตะบนแผนผัง / เลือกจุด:</span>

    <div class="mapbox">

      <div class="stnlist">${sorted.map(({s,d},i)=>`<div class="stnrow${s.id===selId?' sel':''}">
        <div class="row" style="justify-content:space-between"><b>${esc(s.name)}</b><span class="mono small">${d.toFixed(1)} กม.</span></div>
        <span class="small muted">${esc(s.area)}${i===0?' · ใกล้ที่สุด':''}</span>
        <div class="row">${forWizard?`<button class="btn ${s.id===selId?'primary':''}" data-act="pickstn" data-id="${s.id}">${s.id===selId?'เลือกแล้ว':'เลือกโรงพักนี้'}</button>`:''}
        <a class="btn ghost" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}" target="_blank" rel="noopener">นำทาง ↗</a></div>
      </div>`).join('')}</div>
    </div></div>`;
}

function wizNext(){
  const w=S.c.wiz,d=w.d;
  if(w.step===1&&!d.category) return toast('เลือกประเภทเรื่องก่อน');
  if(w.step===2){
    readDetail();
    const err=[]; if(!d.when)err.push('วันเวลาที่เกิดเหตุ'); if(!d.place.trim())err.push('สถานที่'); if(d.desc.trim().length<20)err.push('คำบรรยายอย่างน้อย 20 ตัวอักษร');
    if(d.when&&new Date(d.when)>new Date())err.push('วันเวลาเกิดเหตุต้องไม่เกินปัจจุบัน');
    if(err.length){const e=$('#w-err');e.textContent='กรุณากรอก: '+err.join(', ');e.hidden=false;return}
    if(!d.stationId){const n=STATIONS.map(s=>({s,d:km(S.c.me,s)})).sort((a,b)=>a.d-b.d)[0].s;d.stationId=n.id}
  }
  if(w.step===3&&!d.stationId) return toast('เลือกโรงพักก่อน');
  if(w.step===4&&!d.apptSlot) return toast('เลือกเวลานัดก่อน');
  if(w.step===5){
    if(!$('#w-c1').checked||!$('#w-c2').checked){const e=$('#w-err');e.textContent='กรุณายืนยันทั้งสองข้อก่อนยื่นเรื่อง';e.hidden=false;return}
    return submitCase();
  }
  w.step++; go();
}

function filtered(){
  const f=S.o.f, q=f.q.trim().toLowerCase();
  return DB.cases.filter(c=>{
    if(f.status==='open'&&!OPEN.includes(c.status))return false;
    if(f.status==='over'&&!isOver(c))return false;
    if(f.status==='today'&&!(c.appt&&c.appt.date===dkey(Date.now())&&OPEN.includes(c.status)))return false;
    if(!['open','all','over','today'].includes(f.status)&&c.status!==f.status)return false;
    if(f.level!=='all'&&c.level!==f.level)return false;
    if(f.station!=='all'&&c.stationId!==f.station)return false;
    if(q&&!(c.tracking.toLowerCase().includes(q)||(c.reporter.first+' '+c.reporter.last).toLowerCase().includes(q)||c.desc.toLowerCase().includes(q)))return false;
    return true;
  }).sort((a,b)=>(OPEN.includes(a.status)&&OPEN.includes(b.status))?(LV_ORDER[a.level]-LV_ORDER[b.level]||a.createdAt-b.createdAt):b.createdAt-a.createdAt);

      ${r.type==='monthly'?`<select id="r-m" data-change="rm" style="width:auto">${TH_MF.map((m,i)=>`<option value="${i}" ${r.m===i?'selected':''}>${m}</option>`).join('')}</select>`:''}
      ${r.type!=='daily'?`<select id="r-y" data-change="ry" style="width:auto">${years.map(y=>`<option value="${y}" ${r.y===y?'selected':''}>${y+543}</option>`).join('')}</select>`:''}
      <button class="btn" data-act="rcsv">คัดลอกเป็น CSV</button>
    </div>
    ${S.o.csv?`<div class="field"><label for="r-csvbox">คัดลอกข้อความนี้ไปวางใน Excel</label><textarea id="r-csvbox" readonly style="min-height:90px" class="mono small">${esc(S.o.csv)}</textarea></div>`:''}
    <h2>${R.label}</h2>

      <div class="kpi"><b>${inP.length}</b><span>เรื่องที่รับเข้า</span></div>

      <div><div class="cols">${b.map((v,i)=>`<div style="height:${v/bmax*100}%" data-v="${R.bl(i)}: ${v}" title="${R.bl(i)}: ${v}"></div>`).join('')}</div>

      ${invRows.map(x=>`<tr><td>${esc(x.o.name)}</td><td class="num">${x.open}</td><td class="num">${x.closedP}</td></tr>`).join('')}</tbody></table></div></div>`);

const GPS={busy:false,err:''};
function geoErr(code){
  const m={1:'ไม่ได้รับสิทธิ์เข้าถึงตำแหน่ง กดอนุญาตตำแหน่งในการตั้งค่าเบราว์เซอร์ ถ้าเปิดผ่านลิงก์พรีวิวของ Claude การแชร์ตำแหน่งจะถูกปิดไว้ ให้เปิดไฟล์ที่ฝากไว้บนเว็บ https แทน',2:'หาตำแหน่งไม่ได้ ตรวจสอบว่าเปิด Location/GPS ของมือถือแล้ว',3:'หาตำแหน่งนานเกินไป ลองใหม่อีกครั้ง',9:'เบราว์เซอร์นี้ไม่รองรับการระบุตำแหน่ง'}[code]||'หาตำแหน่งไม่ได้';
  return `<b>${m}</b><br>ระหว่างนี้แตะบนแผนผังหรือเลือกจุดด้านล่าง หรือ <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('สถานีตำรวจ')}" target="_blank" rel="noopener">เปิด Google Maps ค้นหาโรงพักใกล้ฉัน ↗</a>`;
}
function locate(){
  if(!navigator.geolocation){GPS.err=geoErr(9);render();return}
  GPS.busy=true;GPS.err='';render();
  const fail=code=>{GPS.busy=false;GPS.err=geoErr(code);render()};
  try{navigator.geolocation.getCurrentPosition(p=>{GPS.busy=false;S.c.me={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,label:`GPS ของคุณ (±${Math.round(p.coords.accuracy)} ม.)`};render();toast('ได้ตำแหน่งแล้ว')},e=>fail(e.code),{enableHighAccuracy:true,timeout:12000,maximumAge:60000})}catch(e){fail(1)}
}

  /* citizen */
  thaid:el=>{const p=THAID[+el.dataset.i];S.c.profile=p;S.c.pid=p.pid;S.c.otp=null;
    if(DB.citizens[p.pid]&&DB.citizens[p.pid].phone){S.c.view='home';toast('เข้าสู่ระบบด้วย ThaID แล้ว')}else{S.c.view='profile'}go()},
  otpsend:()=>{const ph=$('#pf-phone').value.replace(/\D/g,'');if(!/^0[689]\d{8}$/.test(ph))return toast('กรอกเบอร์มือถือ 10 หลัก ขึ้นต้นด้วย 06, 08 หรือ 09');
    S.c.otp={phone:ph,email:$('#pf-email').value,contact:$('#pf-contact').value};render();toast('ส่งรหัส OTP แล้ว')},
  otpverify:()=>{if($('#pf-otp').value.trim()!=='123456')return toast('รหัส OTP ไม่ถูกต้อง');const p=S.c.profile;
    DB.citizens[p.pid]={pid:p.pid,prefix:p.prefix,first:p.first,last:p.last,birth:p.birth,addr:p.addr,phone:S.c.otp.phone,email:S.c.otp.email,contact:S.c.otp.contact};save();S.c.otp=null;S.c.view='home';go();toast('บันทึกข้อมูลผู้แจ้งแล้ว')},
  profileskip:()=>{S.c.view='home';go()},
  profilesave:()=>{const sv=DB.citizens[S.c.pid],ph=$('#pf-phone').value.replace(/\D/g,'');
    if(ph!==sv.phone){toast('เบอร์ใหม่ต้องยืนยัน OTP ก่อน');return A.otpsend()}
    sv.email=$('#pf-email').value;sv.contact=$('#pf-contact').value;save();S.c.view='home';go();toast('บันทึกข้อมูลผู้แจ้งแล้ว')},
  cview:el=>{const v=el.dataset.v;if(v==='profile'){S.c.profile=THAID.find(p=>p.pid===S.c.pid);S.c.otp=null}S.c.view=v;S.c.justFiled=null;go()},
  clogout:()=>{S.c.view='login';S.c.pid=null;go()},
  ccase:el=>{S.c.caseId=el.dataset.id;S.c.view='case';S.c.justFiled=null;go()},
  ccancel:()=>{const c=DB.cases.find(x=>x.id===S.c.caseId);c.status='cancelled';c.closedAt=Date.now();c.closeReason='ผู้แจ้งยกเลิกเอง';c.history.push({at:Date.now(),by:'ผู้แจ้ง',act:'ยกเลิกเรื่อง',pub:1});save();go();toast('ยกเลิกเรื่องแล้ว')},
  track:()=>{const q=$('#trackq').value.trim().toUpperCase();S.c.trackQ=q;S.c.trackRes=DB.cases.find(c=>c.tracking===q)||false;render()},
  newcase:()=>{S.c.wiz={step:0,d:{files:[]}};S.c.view='new';go()},
  wemer:el=>{S.c.wiz.emergency=el.dataset.v==='1';render()},
  wcat:el=>{S.c.wiz.d.category=el.dataset.k;render()},
  wnext:()=>wizNext(),
  wback:()=>{const w=S.c.wiz;if(w.step===2)readDetail();w.step=Math.max(0,w.step-1);w.emergency=false;go()},
  wdate:el=>{S.c.wiz.d.apptDate=el.dataset.k;S.c.wiz.d.apptSlot=null;render()},
  wslot:el=>{S.c.wiz.d.apptSlot=el.dataset.s;render()},
  pickstn:el=>{if(S.c.view==='new'&&S.c.wiz&&S.c.wiz.step===3){S.c.wiz.d.stationId=el.dataset.id;S.c.wiz.d.apptDate=null;S.c.wiz.d.apptSlot=null;render()}},
  preset:el=>{const p=PRESETS.find(x=>x.label===el.dataset.l);S.c.me={...p};render()},
  /* officer */
  ologin:el=>{S.o.id=el.dataset.id;S.o.view='inbox';go()},
  ologout:()=>{S.o.view='login';S.o.id=null;go()},
  reset:()=>{if(S.o.confirmReset){DB=seed();save();S.o.confirmReset=false;toast('รีเซ็ตข้อมูลตัวอย่างแล้ว');go()}else{S.o.confirmReset=true;toast('กดอีกครั้งเพื่อยืนยันการรีเซ็ต');setTimeout(()=>S.o.confirmReset=false,4000)}},
  oview:el=>{S.o.view=el.dataset.v;S.o.csv=null;go()},
  ofilter:el=>{S.o.f={status:el.dataset.v,level:'all',station:'all',q:''};render()},
  ocase:el=>{S.o.caseId=el.dataset.id;S.o.view='case';S.o.showPid=false;go()},
  showpid:()=>{const c=curCase();S.o.showPid=true;log(c,'เปิดดูเลขบัตรประชาชนของผู้แจ้ง','',0);save();render()},
  oaccept:()=>{const c=curCase();c.status='accepted';c.acceptedAt=Date.now();log(c,'รับเรื่อง','',1);save();render();toast('รับเรื่องแล้ว')},
  oassign:()=>{const c=curCase(),o=off($('#a-off').value);c.assignee=o.id;if(!c.acceptedAt)c.acceptedAt=Date.now();if(['new','accepted'].includes(c.status))c.status='assigned';log(c,`มอบหมายให้ ${o.name}`,'',1);save();render();toast('มอบหมายแล้ว')},
  oconfirm:()=>{const c=curCase();c.appt.confirmed=true;log(c,`ยืนยันนัดหมาย ${fd(fromKey(c.appt.date))} เวลา ${c.appt.slot} น.`,'',1);save();render();toast('ยืนยันนัดแล้ว ระบบส่ง SMS ถึงผู้แจ้ง (จำลอง)')},
  oresched:()=>{const c=curCase(),d=$('#a-date').value,s=$('#a-slot').value;if(!d)return toast('เลือกวันที่');c.appt={date:d,slot:s,confirmed:true};log(c,`นัดหมาย ${fd(fromKey(d))} เวลา ${s} น.`,'',1);save();render();toast('บันทึกนัดแล้ว')},
  onoshow:()=>{const c=curCase();c.appt.noShow=true;log(c,'ผู้แจ้งไม่มาตามนัด','',1);save();render()},
  olevel:()=>{const c=curCase(),lv=$('#a-lv').value,why=$('#a-lvwhy').value.trim();if(lv===c.level)return toast('ระดับเดิม');if(!why)return toast('ระบุเหตุผลการปรับระดับ');log(c,`ปรับระดับจาก${LV[c.level].name}เป็น${LV[lv].name}`,why,0);c.level=lv;save();render()},
  ostatus:()=>{const c=curCase(),st=$('#a-st').value,note=$('#a-note').value.trim(),pub=$('#a-pub').checked;if(st===c.status&&!note)return toast('เลือกสถานะใหม่หรือพิมพ์บันทึก');
    if(st!==c.status){if(st!=='new'&&!c.acceptedAt)c.acceptedAt=Date.now();c.status=st;log(c,`เปลี่ยนสถานะเป็น "${ST[st]}"`,note,pub)}else log(c,'บันทึกความคืบหน้า',note,pub);save();render();toast('บันทึกแล้ว')},
  oclose:()=>{const c=curCase(),v=$('#a-close').value,n=$('#a-closenote').value.trim();if(v==='__ref'){if(!n)return toast('ระบุหน่วยงานที่ส่งต่อ');c.status='referred';c.closeReason='ส่งต่อ: '+n}else{c.status=v==='ผู้แจ้งขอถอนเรื่อง'?'cancelled':'closed';c.closeReason=v+(n?` (${n})`:'')}
    c.closedAt=Date.now();if(!c.acceptedAt)c.acceptedAt=c.closedAt;log(c,`ปิดเรื่อง: ${c.closeReason}`,'',1);save();render();toast('ปิดเรื่องแล้ว')},
  oreopen:()=>{const c=curCase();c.status='investigating';c.closedAt=null;c.closeReason=null;log(c,'เปิดเรื่องใหม่โดยหัวหน้างานสอบสวน','',1);save();render()},
  rtype:el=>{S.o.rep.type=el.dataset.v;S.o.csv=null;render()},
  rcsv:()=>{const R=repRange();const rows=DB.cases.filter(c=>c.createdAt>=R.a&&c.createdAt<R.b);
    const head=['เลขติดตาม','วันที่ยื่น','ประเภท','ระดับ','สถานะ','โรงพัก','พนักงานสอบสวน','วันที่ปิด','เหตุผลปิด'];
    const csv=[head,...rows.map(c=>[c.tracking,fdt(c.createdAt),CATS[c.category].name,LV[c.level].name,ST[c.status],stn(c.stationId).name,c.assignee?off(c.assignee).name:'',c.closedAt?fdt(c.closedAt):'',c.closeReason||''])].map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
    const done=()=>toast(`คัดลอก ${rows.length} แถวแล้ว วางใน Excel ได้เลย`);
    try{navigator.clipboard.writeText(csv).then(done,()=>{S.o.csv=csv;render()})}catch(e){S.o.csv=csv;render()}}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el){if(el.tagName==='BUTTON'||el.tagName==='A'&&el.dataset.act)e.preventDefault();const f=A[el.dataset.act];if(f)f(el);return}
  const svg=e.target.closest('svg.map');
  if(svg){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());S.c.me={...unpx(p.x,p.y),label:'จุดที่เลือกบนแผนผัง'};render()}
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.change;if(!k)return;const v=e.target.value,f=S.o.f,r=S.o.rep;
  if(k==='fstatus')f.status=v;if(k==='flevel')f.level=v;if(k==='fstation')f.station=v;if(k==='fq')f.q=v;
  if(k==='rday')r.day=v;if(k==='rm')r.m=+v;if(k==='ry')r.y=+v;S.o.csv=null;render();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='trackq'){A.track()}if(e.key==='Enter'&&e.target.id==='f-q'){S.o.f.q=e.target.value;render()}});
function fromHash(){const h=(location.hash||'').slice(1);S.mode=['officer','citizen','nearby'].includes(h)?h:'home'}
window.addEventListener('hashchange',()=>{fromHash();render()});
fromHash();render();
</script>
</body></html>
